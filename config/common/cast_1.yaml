# Slim CAST-1 configuration derived from Apollo Automation firmware 26.10.30.1.
# The Apollo package is deliberately not imported; review upstream ESP32 and audio changes before porting them here.

packages:
  - !include components/base.yaml
  - !include components/internal_temperature_sensor.yaml

substitutions:
  device_description: Apollo Automation CAST-1 audio receiver

esphome:
  min_version: 2026.10.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_32KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      # Keep Bluetooth allocations out of the internal RAM needed by audio.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Sendspin can remain healthy without a connected Home Assistant API client.
api:
  reboot_timeout: 0s

# These settings avoid Wi-Fi power management and roam scans interrupting audio.
wifi:
  power_save_mode: none
  post_connect_roaming: false

esp32_ble_tracker:
  scan_parameters:
    continuous: true

bluetooth_proxy:

i2c:
  id: cast_i2c
  sda: GPIO47
  scl: GPIO48

audio_dac:
  - platform: pcm5122
    id: cast_dac
    i2c_id: cast_i2c
    address: 0x4D
    bits_per_sample: 16bit

i2s_audio:
  - id: cast_i2s
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO14

speaker:
  - platform: i2s_audio
    id: cast_i2s_speaker
    i2s_audio_id: cast_i2s
    sample_rate: 48000
    i2s_dout_pin: GPIO9
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms

  # Keep this task stack in internal RAM; PSRAM skews time-sensitive audio.
  - platform: resampler
    id: media_resampler
    output_speaker: cast_i2s_speaker
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: cast_sendspin
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_source

media_player:
  - platform: sendspin
    id: sendspin_group_player
    name: "Sendspin Player"

  - platform: speaker_source
    id: cast_player
    name: "Player"
    volume_increment: 0.05

    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampler
      sources:
        - sendspin_source

    on_state:
      # The PCM5122 starts muted; this operation is safe to repeat.
      - audio_dac.mute_off: cast_dac
