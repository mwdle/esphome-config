i2c:
  sda: D7
  scl: D6
  scan: true
  frequency: 400khz # Default of 50khz breaks Wi-Fi due to blocking delays? Higher values increase power consumption but yield faster display updates.

# Balance/reduce OLED burn-in by inverting the display colors each minute
interval:
  - interval: 1min
    then:
      - lambda: |-
          static bool inverted = false;
          inverted = !inverted;
          id(screen).set_invert(inverted);

globals:
  - id: selected_playlist
    type: int
    initial_value: "0"
  - id: playlists
    type: std::vector<char*>

display:
  - platform: ssd1306_i2c
    id: screen
    model: "SSD1306 128x64"
    address: 0x3C
    rotation: 180°
    contrast: 0% # Use the lowest "brightness" to save battery life (ESPHome brightness attribute doesn't work for SSD1306, use contrast instead)
    update_interval: 42ms # ~24fps
    on_page_change:
      - to: playlistSelectionPage
        then:
          - homeassistant.action:
              action: music_assistant.get_library
              data:
                media_type: playlist
              data_template:
                config_entry_id: "{{ config_entry_id('${music_assistant_player}') }}"
              capture_response: true
              response_template: "{{ response['items'] | map(attribute='name') | list }}" # Map the JSON response from Music Assistant into a list of playlist names
              on_success:
                - lambda: load_playlists_from_json(response); # Load the JSON array of playlist names from response_template (see music_remote.h)
              on_error:
                - logger.log:
                    format: "Failed to get playlists: %s"
                    level: WARN
                    args: ["error.c_str()"]
    pages:
      - id: playbackPage
        lambda: |-
          // Draw the currently playing song title and artist
          render_active_media();
          // Draw common UI controls:
          render_ui_controls();
      - id: playlistSelectionPage
        lambda: |-
          // Draw Playlist Selection UI
          render_playlist_selection();
          // Draw common UI controls:
          render_ui_controls();
      - id: statsPage
        lambda: |-
          // Draw connection statistics (such as wifi, HA API connection status, etc)
          render_statistics();
          // Draw common UI controls
          render_ui_controls();

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: TX
      inverted: true
      mode:
        input: true
        pullup: true
    id: play_selected_playlist_button # Rotary Encoder button
    on_press:
      then:
        - if:
            condition:
              lambda: "return id(screen).get_active_page() == id(playlistSelectionPage);" # Only register encoder button presses if user is on playlist selection page
            then:
              - homeassistant.action:
                  action: music_assistant.play_media
                  data:
                    entity_id: ${music_assistant_player}
                    media_type: playlist
                    enqueue: replace
                  data_template:
                    media_id: "{{ playlist }}"
                  variables:
                    playlist: !lambda "return id(playlists).at(id(selected_playlist));"
              - display.page.show: playbackPage
  - platform: gpio
    internal: true
    pin:
      number: RX
      mode:
        input: true
        pullup: true
    id: next_page_button
    on_press:
      - display.page.show_next: screen
  - platform: gpio
    internal: true
    pin:
      number: D3
      mode:
        input: true
        pullup: true
    id: media_previous_track
    trigger_on_initial_state: true
    on_multi_click:
      - timing: # on short press
          - OFF for at most 1s
          - ON for at least 0.05s
        then:
          - homeassistant.action:
              action: media_player.media_previous_track
              data:
                entity_id: ${music_assistant_player}
      - timing: # on long press
          - OFF for at least 1.05s
        then:
          - homeassistant.action:
              action: media_player.media_seek
              data:
                entity_id: ${music_assistant_player}
              data_template:
                seek_position:
                  >- # Derive the current position because Home Assistant only updates the attribute after playback interactions.
                  {% set new_position = (int((now() - state_attr("${music_assistant_player}",
                  "media_position_updated_at")).seconds + state_attr("${music_assistant_player}",
                  "media_position")) - 15) %}
                  {% if new_position >= 0 %}
                  {{ new_position }}
                  {% else %}
                  {{ 0 }}
                  {% endif %}
  - platform: gpio
    internal: true
    pin:
      number: D4
      mode:
        input: true
        pullup: true
    id: media_play_pause
    on_press:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: ${music_assistant_player}
  - platform: gpio
    internal: true
    pin:
      number: D5
      mode:
        input: true
        pullup: true
    id: media_shuffle_toggle
    on_press:
      - homeassistant.action:
          action: media_player.shuffle_set
          data:
            entity_id: ${music_assistant_player}
          data_template:
            shuffle: "{{ not state_attr('${music_assistant_player}', 'shuffle') }}"
  - platform: gpio
    internal: true
    pin:
      number: D8
      inverted: true
      mode:
        input: true # Internal pullup not available on D8, needs external pullup resistor
    id: media_next_track
    trigger_on_initial_state: true
    on_multi_click:
      - timing: # on short press
          - OFF for at most 1s
          - ON for at least 0.05s
        then:
          - homeassistant.action:
              action: media_player.media_next_track
              data:
                entity_id: ${music_assistant_player}
      - timing: # on long press
          - OFF for at least 1.05s
        then:
          - homeassistant.action:
              action: media_player.media_seek
              data:
                entity_id: ${music_assistant_player}
              data_template:
                seek_position:
                  >- # Derive the current position because Home Assistant only updates the attribute after playback interactions.
                  {% set new_position = (int((now() - state_attr("${music_assistant_player}",
                  "media_position_updated_at")).seconds + state_attr("${music_assistant_player}",
                  "media_position")) + 15) %}
                  {% if new_position < state_attr("${music_assistant_player}", "media_duration") %}
                  {{ new_position }}
                  {% else %}
                  {{ state_attr("${music_assistant_player}", "media_duration") - 1 }}
                  {% endif %}

  - platform: homeassistant
    id: media_shuffle
    entity_id: ${music_assistant_player}
    attribute: shuffle
    internal: true

sensor:
  - platform: rotary_encoder
    name: "Volume"
    id: volume
    pin_a:
      number: D2
      mode:
        input: true
        pullup: true
    pin_b:
      number: D1
      mode:
        input: true
        pullup: true
    publish_initial_value: true
    on_clockwise:
      then:
        - if:
            condition:
              lambda: "return id(screen).get_active_page() == id(playlistSelectionPage);"
            then:
              - lambda: "if (id(playlists).size() > 0) id(selected_playlist) = (id(selected_playlist) + 1) % id(playlists).size();"
            else:
              - homeassistant.action:
                  action: media_player.volume_up
                  data:
                    entity_id: ${music_assistant_player}
    on_anticlockwise:
      then:
        - if:
            condition:
              lambda: "return id(screen).get_active_page() == id(playlistSelectionPage);"
            then:
              - lambda: "if (id(playlists).size() > 0) id(selected_playlist) = (id(selected_playlist) - 1 + id(playlists).size()) % id(playlists).size();"
            else:
              - homeassistant.action:
                  action: media_player.volume_down
                  data:
                    entity_id: ${music_assistant_player}
    filters:
      - debounce: 10ms
    internal: true
  - platform: homeassistant
    id: media_volume
    entity_id: ${music_assistant_player}
    attribute: volume_level
    unit_of_measurement: "%"
    internal: true

text_sensor:
  - platform: homeassistant
    id: media_title
    entity_id: ${music_assistant_player}
    attribute: media_title
    internal: true
  - platform: homeassistant
    id: media_artist
    entity_id: ${music_assistant_player}
    attribute: media_artist
    internal: true
  - platform: homeassistant
    id: media_status
    entity_id: ${music_assistant_player}
    internal: true
